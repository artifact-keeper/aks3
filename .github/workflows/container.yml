name: container

# Builds ghcr.io/artifact-keeper/aks3, and publishes it from main and release
# tags.
#
# Pull requests run the build, the smoke gate and the vulnerability gate but
# touch the registry not at all: the steps that need a writable token are
# skipped, because a pull request from a fork is given a read-only one and the
# login alone would fail. What is left still answers the question a pull
# request asks, which is whether this change produces an image that works and
# is fit to publish.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

# Granted per job rather than here, so the merge job never holds the
# code-scanning write that only the build job has any use for.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # One job per architecture, each on a runner of that architecture. Native
  # compilation rather than QEMU, because emulating a Rust build of this size
  # takes long enough to stop being worth the simpler workflow.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolved once, and fed to both builds below, so the image that gets
      # smoke tested is the same image that gets pushed rather than one that
      # differs by a timestamp label.
      #
      # title, description and licenses are pinned here rather than left to be
      # inferred from the GitHub repository, which would make the labels change
      # when someone edits the repository blurb. revision, created and version
      # come from the event and are the point of running this at all: without
      # them the image keeps ubi-micro's own revision label, which combined with
      # our source label reads as aks3 at a Red Hat commit.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=aks3
            org.opencontainers.image.description=Single-binary S3-compatible object store
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Loaded into the local daemon, not pushed. The smoke test below is what
      # decides whether this image is allowed to leave the runner.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: aks3:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Preinstalled on GitHub's Ubuntu images. The fallback is here because
      # the toolset differs between the x86 and Arm images, and a smoke test
      # that silently skipped its only real assertion would be worse than a
      # slower one.
      - name: Ensure the AWS CLI is present
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp/awscliv2
            sudo /tmp/awscliv2/aws/install
          fi
          aws --version

      - name: Smoke test
        run: tests/container/smoke.sh aks3:candidate

      # -----------------------------------------------------------------
      # The vulnerability policy, and why it is drawn here rather than
      # somewhere stricter.
      #
      # Blocks the push: CRITICAL or HIGH that upstream has already fixed.
      # Those are the findings someone can act on the same day, by taking a
      # newer base image or a newer dependency, so an image carrying one has
      # no business being published.
      #
      # Reported but does not block: everything with no fix released yet, at
      # any severity, plus everything at MEDIUM and below. ubi-micro's
      # packages are Red Hat's to fix, and failing on an unfixed one would
      # park every merge in the repository behind a release nobody here can
      # make. A gate that blocks on work you cannot do is a gate that gets
      # switched off, so these go to code scanning and the job summary
      # instead, where they are visible and have a history.
      #
      # A finding that is fixed upstream but deliberately not being taken
      # goes in .trivyignore.yaml, which asks for a reason and an expiry date
      # on every entry. The expiry is the point: an exception has to be
      # renewed on purpose rather than outliving the reason for it.
      #
      # Scope is the OS packages, which is all a scan of this image can see.
      # The Rust dependencies are cargo-deny's job in ci.yml, which reads
      # Cargo.lock and so sees the whole tree rather than what survived into
      # a stripped binary. Neither covers the other, and both run.
      # -----------------------------------------------------------------
      #
      # This first pass takes everything and fails on nothing: it is the
      # record, and the gate below is the decision. Its output goes under
      # runner.temp rather than the workspace, so neither it nor the SARIF
      # derived from it joins the build context that the push sends to the
      # daemon.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aks3:candidate
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/trivy-report.json
          exit-code: "0"

      - name: Summarise what the scan found
        env:
          ARCH: ${{ matrix.arch }}
          REPORT: ${{ runner.temp }}/trivy-report.json
          SARIF: ${{ runner.temp }}/trivy-results.sarif
        run: |
          trivy convert --format sarif --output "$SARIF" "$REPORT"
          {
            echo "### Image vulnerabilities: ${ARCH}"
            echo
            echo "| Severity | Found | Fixed upstream |"
            echo "| --- | ---: | ---: |"
            jq -r '
              [.Results[]?.Vulnerabilities[]?] as $all
              | ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"][]
              | . as $sev
              | [$all[] | select(.Severity == $sev)] as $found
              | [$found[] | select((.FixedVersion // "") != "")] as $fixed
              | "| \($sev) | \($found | length) | \($fixed | length) |"
            ' "$REPORT"
            echo
            echo "The right-hand column is what the gate blocks on, at CRITICAL and HIGH."
          } >> "$GITHUB_STEP_SUMMARY"

      # Skipped for a pull request from a fork, which is handed a read-only
      # token and cannot write security events. The gate below still runs
      # there, so a fork's pull request is checked, just not recorded.
      - name: Publish the report to code scanning
        if: github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/trivy-results.sarif
          # Distinct per architecture, or the two jobs would each overwrite
          # the other's results under one category and only the loser's
          # findings would survive.
          category: trivy-${{ matrix.arch }}

      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aks3:candidate
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Named explicitly: trivy reads a plain .trivyignore on its own but
          # not the YAML form, and the YAML form is the one with expiry dates.
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table

      # The same build again, which the layer cache makes close to free, this
      # time as a push of an untagged manifest. Tags are applied once, by the
      # merge job, so no tag ever points at a half-published set of platforms.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Ties the per-architecture digests together under the tags a user actually
  # pulls. Runs only if both builds and both smoke tests passed, and never on a
  # pull request, which has nothing pushed to tie together.
  merge:
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only from the default branch; a version tag such as v0.2.0
      # publishes 0.2.0, without the v, because that is what a Docker tag
      # conventionally looks like. Every build also gets an immutable
      # sha-<short> tag to pin to.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # both substitutions are deliberately word-split into arguments
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect what was published
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
