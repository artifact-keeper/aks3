name: container

# Publishes ghcr.io/artifact-keeper/aks3. Nothing here runs on pull requests:
# a fork cannot be given a token that writes to the registry, and there is no
# useful half of this that runs without one.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # One job per architecture, each on a runner of that architecture. Native
  # compilation rather than QEMU, because emulating a Rust build of this size
  # takes long enough to stop being worth the simpler workflow.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loaded into the local daemon, not pushed. The smoke test below is what
      # decides whether this image is allowed to leave the runner.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: aks3:candidate
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Preinstalled on GitHub's Ubuntu images. The fallback is here because
      # the toolset differs between the x86 and Arm images, and a smoke test
      # that silently skipped its only real assertion would be worse than a
      # slower one.
      - name: Ensure the AWS CLI is present
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp/awscliv2
            sudo /tmp/awscliv2/aws/install
          fi
          aws --version

      - name: Smoke test
        run: tests/container/smoke.sh aks3:candidate

      # The same build again, which the layer cache makes close to free, this
      # time as a push of an untagged manifest. Tags are applied once, by the
      # merge job, so no tag ever points at a half-published set of platforms.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Ties the per-architecture digests together under the tags a user actually
  # pulls. Runs only if both builds and both smoke tests passed.
  merge:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only from the default branch; a version tag such as v0.2.0
      # publishes 0.2.0, without the v, because that is what a Docker tag
      # conventionally looks like. Every build also gets an immutable
      # sha-<short> tag to pin to.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # both substitutions are deliberately word-split into arguments
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect what was published
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
