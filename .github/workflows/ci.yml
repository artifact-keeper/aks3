name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same version as rust-toolchain.toml, which is what cargo obeys inside
      # the checkout. Naming it here too is what keeps the action from
      # installing one compiler and the build from downloading another, and
      # keeps the cache key describing the compiler actually used. The action
      # has no way to read the file, so the two move together by hand.
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.98", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # PROPTEST_CASES is pinned rather than left to proptest's default so that
      # what CI covers is a number in this file, not whatever the dependency
      # ships. It is four times the default (256): the property suites cost
      # about 0.6 s at this setting against 0.15 s at the default, which buys
      # four times the inputs for a rounding error on a 3-minute job. A failing
      # case prints a `cc <seed>` line to paste into the matching file under
      # crates/engine/proptest-regressions/, so a CI-only failure is
      # reproducible locally without rerunning at this count.
      # The crash harness's disk-full leg fills a filesystem completely, which
      # it may only do to one mounted for it. Mounting needs root, so it happens
      # here rather than inside the test: with AKS3_ENOSPC_DIR unset the leg
      # prints why it is skipping and passes, which is what keeps
      # `cargo test --workspace` runnable without sudo everywhere else.
      - run: tests/enospc/setup-loopback.sh
      # AKS3_ENOSPC_REQUIRED turns the leg's skip into a failure. The mount
      # exists by the time this runs, so a skip here means the wiring broke, and
      # a skipped leg that passes looks exactly like a leg that ran.
      - run: cargo test --workspace
        env:
          PROPTEST_CASES: "1024"
          AKS3_ENOSPC_DIR: /mnt/aks3-enospc
          AKS3_ENOSPC_REQUIRED: "1"
      # Before the teardown, because the crash harness archives the post-crash
      # store under the target directory and a disk-full failure would otherwise
      # destroy its own evidence when the filesystem holding it is unmounted.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: crash-artifacts
          path: target/tmp/crash-artifacts/
          if-no-files-found: ignore
      # Even when the tests failed: a loop device and a mount left behind
      # outlive the job on a self-hosted runner, and cost nothing to release on
      # a hosted one.
      - run: tests/enospc/setup-loopback.sh --teardown
        if: always()
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Runs the allowlisted subset of ceph/s3-tests against a real aks3 process.
  # The allowlist is the gate: a change that breaks one of those behaviours
  # fails here rather than in whatever client hits it first.
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.98" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: tests/compliance/run-s3-tests.sh
