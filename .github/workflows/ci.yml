name: ci
on:
  push: { branches: [master] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same version as rust-toolchain.toml, which is what cargo obeys inside
      # the checkout. Naming it here too is what keeps the action from
      # installing one compiler and the build from downloading another, and
      # keeps the cache key describing the compiler actually used. The action
      # has no way to read the file, so the two move together by hand.
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.98", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Runs the allowlisted subset of ceph/s3-tests against a real aks3 process.
  # The allowlist is the gate: a change that breaks one of those behaviours
  # fails here rather than in whatever client hits it first.
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.98" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: tests/compliance/run-s3-tests.sh
