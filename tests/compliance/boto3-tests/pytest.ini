# Makes this directory pytest's rootdir when the suite is invoked from
# anywhere, which run-s3-tests.sh does: it runs from inside the s3-tests
# checkout, whose own pytest.ini would otherwise be a candidate.
[pytest]
testpaths = .
# Long enough that no test here can legitimately reach it, short enough that a
# server which stops answering fails the job in seconds rather than sitting on
# a runner. The suite's whole runtime is a couple of seconds.
timeout = 60
