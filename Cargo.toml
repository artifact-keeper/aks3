[workspace]
resolver = "2"
members = ["crates/server", "crates/api", "crates/engine", "crates/iam"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The floor is set by the AWS SDK crates the server's smoke test builds
# against, which is above what aks3's own code needs. Cargo reports it as a
# clear "requires rustc 1.94.1" rather than the wall of errors an unsupported
# compiler would otherwise produce partway through a dependency.
rust-version = "1.94.1"
license = "AGPL-3.0-only"
repository = "https://github.com/artifact-keeper/aks3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
s3s = "0.14"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }
md-5 = "0.11"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1"
http = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "service"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
tempfile = "3"
dashmap = "6"
